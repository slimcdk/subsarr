name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pull requests from forks and Dependabot runs get a read-only GITHUB_TOKEN
  # (and fork PRs must not publish images anyway); they are built but not
  # pushed. Everything else is pushed.
  PUSH: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            # any other branch (push or workflow_dispatch) → branch name, e.g. feat-search-overhaul
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            # same-repo pull request → pr-<number>
            type=ref,event=pr
            # every build → sha-<short commit>, so a tested build can be pinned exactly
            type=sha
            # version tag → v1.2.3, v1.2, and latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
