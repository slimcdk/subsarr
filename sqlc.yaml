version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/sqlite/queries.sql"
    schema: "sql/sqlite/schema.sql"
    gen:
      go:
        package: "sqlitedb"
        out: "internal/database/sqlitedb"

  - engine: "postgresql"
    queries: "sql/postgres/queries.sql"
    schema: "sql/postgres/schema.sql"
    gen:
      go:
        package: "pgdb"
        out: "internal/database/pgdb"

  - engine: "mysql"
    queries: "sql/mysql/queries.sql"
    schema: "sql/mysql/schema.sql"
    gen:
      go:
        package: "mysqldb"
        out: "internal/database/mysqldb"
