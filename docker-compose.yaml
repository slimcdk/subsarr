volumes:
  data:

services:

  subsarr:
    # image: ghcr.io/slimcdk/subsarr:dev
    build: .
    ports:
      - 8091:8090
    environment:
      SUBSARR_DB_DRIVER: sqlite
      SUBSARR_DB_DSN: /app/data/subsarr.db
      SUBSARR_STORAGE_BACKEND: filesystem
      SUBSARR_STORAGE_PATH: /app/data/storage
    volumes:
      - data:/app/data
      - ./subscene-dump:/tmp/subscene-archive
    restart: unless-stopped
